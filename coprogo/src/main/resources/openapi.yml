openapi: 3.0.1
info:
  title: coprogo
  version: 1.0.0
paths:
  /api/group-invitations/pending:
    get:
      tags:
      - Groups
      summary: List the pending invitations for the authenticated member
      operationId: listPending
      responses:
        "200":
          description: listPending 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingGroupInvitationResponse"
      security:
      - bearerAuth: []
  /api/group-invitations/{invitationId}/accept:
    post:
      tags:
      - Groups
      summary: Accept a pending group invitation
      operationId: accept
      parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: accept 204 response
      security:
      - bearerAuth: []
  /api/groups:
    post:
      tags:
      - Groups
      summary: Create a new group for the authenticated member
      operationId: create
      responses:
        "200":
          description: create 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGroupResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}:
    get:
      tags:
      - Groups
      summary: Get the group details for the authenticated member
      operationId: get
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: get 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/balances:
    get:
      tags:
      - Ledger
      summary: Get member ledger balances for a group
      operationId: getGroupBalances
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getGroupBalances 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupBalancesResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/cash-pool-incomes:
    post:
      tags:
      - RevenueDistribution
      summary: Record incoming cash-pool income and distribute it according to effective
        ownership shares
      operationId: recordCashPoolIncome
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCashPoolIncomeRequest"
        required: true
      responses:
        "204":
          description: recordCashPoolIncome 204 response
      security:
      - bearerAuth: []
  /api/groups/{groupId}/cash-pool/balance:
    get:
      tags:
      - Ledger
      summary: Get the available common cash-pool balance for a group
      operationId: getCashPoolBalance
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getCashPoolBalance 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashPoolBalanceResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/cash-pool/shares:
    get:
      tags:
      - Ledger
      summary: Get remaining common cash-pool shares by member for a group
      operationId: getMemberCashPoolShares
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getMemberCashPoolShares 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberCashPoolSharesResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses:
    get:
      tags:
      - Expenses
      summary: List expenses for a group
      operationId: listGroupExpenses
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: listGroupExpenses 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - Expenses
      summary: Propose an expense
      operationId: proposeExpense
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeExpenseRequest"
        required: true
      responses:
        "409":
          description: Supporting document upload intent is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "204":
          description: proposeExpense 204 response
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}:
    get:
      tags:
      - Expenses
      summary: Get expense details
      operationId: getExpenseDetail
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getExpenseDetail 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseDetailResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}/participation-decisions:
    post:
      tags:
      - Expenses
      summary: Record a participation decision for an expense
      operationId: recordParticipationDecision
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseParticipationDecisionRequest"
        required: true
      responses:
        "204":
          description: recordParticipationDecision 204 response
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}/supporting-document-audit-entries:
    get:
      tags:
      - Supporting documents
      summary: List supporting document audit entries for an expense
      operationId: listExpenseSupportingDocumentAuditTrail
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Supporting document audit entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseSupportingDocumentAuditEntryResponse"
        "404":
          description: Expense is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}/supporting-documents:
    get:
      tags:
      - Supporting documents
      summary: List current and historical supporting documents for an expense
      operationId: listExpenseSupportingDocuments
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Supporting documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseSupportingDocumentsResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}/supporting-documents/{sourceUploadIntent}:
    delete:
      tags:
      - Supporting documents
      summary: Delete a supporting document for an expense
      operationId: deleteExpenseSupportingDocument
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sourceUploadIntent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Supporting document deleted
        "404":
          description: Supporting document is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/expenses/{expenseId}/supporting-documents/{sourceUploadIntent}/replacements:
    post:
      tags:
      - Supporting documents
      summary: Replace a supporting document for an expense
      operationId: replaceExpenseSupportingDocument
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: expenseId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: sourceUploadIntent
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceExpenseSupportingDocumentRequest"
        required: true
      responses:
        "204":
          description: Supporting document replaced
        "404":
          description: Supporting document is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Replacement upload intent is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/invitations:
    post:
      tags:
      - Groups
      summary: Invite a member to a group
      operationId: invite
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
        required: true
      responses:
        "204":
          description: invite 204 response
      security:
      - bearerAuth: []
  /api/groups/{groupId}/ownership-shares:
    get:
      tags:
      - RevenueDistribution
      summary: Get ownership-share history for a group
      operationId: getOwnershipShareTimeline
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getOwnershipShareTimeline 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnershipShareTimelineResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - RevenueDistribution
      summary: Record an ownership-share change for a group
      operationId: recordOwnershipShareChange
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordOwnershipShareChangeRequest"
        required: true
      responses:
        "204":
          description: recordOwnershipShareChange 204 response
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements:
    get:
      tags:
      - Reimbursements
      summary: List reimbursements for a group
      operationId: listReimbursements
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Reimbursements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReimbursementResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements/direct:
    post:
      tags:
      - Reimbursements
      summary: Record a direct reimbursement
      operationId: recordDirectReimbursement
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectReimbursementRequest"
        required: true
      responses:
        "204":
          description: Direct reimbursement recorded
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements/documented:
    post:
      tags:
      - Reimbursements
      summary: Declare a documented reimbursement
      operationId: declareDocumentedReimbursement
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentedReimbursementRequest"
        required: true
      responses:
        "204":
          description: Documented reimbursement declared
        "409":
          description: Supporting document upload intent is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements/{reimbursementId}:
    get:
      tags:
      - Reimbursements
      summary: Get reimbursement details
      operationId: getReimbursement
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reimbursementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Reimbursement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReimbursementResponse"
        "404":
          description: Reimbursement is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements/{reimbursementId}/acceptance:
    post:
      tags:
      - Reimbursements
      summary: Accept a documented reimbursement
      operationId: acceptReimbursement
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reimbursementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Reimbursement accepted
        "404":
          description: Reimbursement is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/reimbursements/{reimbursementId}/rejection:
    post:
      tags:
      - Reimbursements
      summary: Reject a documented reimbursement
      operationId: rejectReimbursement
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: reimbursementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReimbursementRejectionRequest"
        required: true
      responses:
        "204":
          description: Reimbursement rejected
        "404":
          description: Reimbursement is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/revenue-distribution/preview:
    post:
      tags:
      - RevenueDistribution
      summary: Preview revenue distribution from the recorded ownership-share timeline
      operationId: previewAtDate
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueDistributionAtDatePreviewRequest"
        required: true
      responses:
        "200":
          description: previewAtDate 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueDistributionAtDatePreviewResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/supporting-document-uploads:
    post:
      tags:
      - Supporting document uploads
      summary: Start a supporting document upload
      operationId: startUpload
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportingDocumentUploadRequest"
        required: true
      responses:
        "201":
          description: Supporting document upload target created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportingDocumentUploadResponse"
      security:
      - bearerAuth: []
  /api/groups/{groupId}/supporting-document-uploads/{uploadIntentId}/confirmation:
    post:
      tags:
      - Supporting document uploads
      summary: Confirm a supporting document upload
      operationId: confirmUpload
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: uploadIntentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: confirmUpload 204 response
      security:
      - bearerAuth: []
  /api/revenue-distribution/preview:
    post:
      tags:
      - RevenueDistribution
      summary: Preview ownership-share-based revenue distribution
      operationId: preview
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueDistributionPreviewRequest"
        required: true
      responses:
        "200":
          description: preview 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueDistributionPreviewResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    ApiErrorResponse:
      required:
      - message
      - path
      type: object
      properties:
        message:
          type: string
        path:
          type: string
    CashPoolBalanceResponse:
      required:
      - availableAmountInCents
      - group
      type: object
      properties:
        group:
          type: string
          format: uuid
        availableAmountInCents:
          type: integer
          format: int64
    CreateGroupResponse:
      required:
      - group
      type: object
      properties:
        group:
          type: string
          format: uuid
    CumulativeExpenseTierRequest:
      required:
      - participants
      - upToAmountInCents
      type: object
      properties:
        upToAmountInCents:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
        participants:
          minItems: 1
          type: array
          items:
            minLength: 1
            type: string
            format: email
    CumulativeTiersExpenseAllocationRequest:
      required:
      - tiers
      - type
      type: object
      properties:
        tiers:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/CumulativeExpenseTierRequest"
        type:
          type: string
          enum:
          - CUMULATIVE_TIERS
    CustomExpenseAllocationRequest:
      required:
      - participations
      - type
      type: object
      properties:
        participations:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/CustomExpenseParticipationRequest"
        type:
          type: string
          enum:
          - CUSTOM
    CustomExpenseParticipationRequest:
      required:
      - amountInCents
      - member
      type: object
      properties:
        member:
          minLength: 1
          type: string
          format: email
        amountInCents:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
    DirectReimbursementRequest:
      required:
      - amountInCents
      - paidBy
      - reimbursedAt
      type: object
      properties:
        paidBy:
          minLength: 1
          type: string
          format: email
        amountInCents:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
        reimbursedAt:
          type: string
          format: date-time
    DocumentedReimbursementRequest:
      required:
      - amountInCents
      - receivedBy
      - reimbursedAt
      - supportingDocumentUploadIntents
      type: object
      properties:
        receivedBy:
          minLength: 1
          type: string
          format: email
        amountInCents:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
        reimbursedAt:
          type: string
          format: date-time
        supportingDocumentUploadIntents:
          minItems: 1
          type: array
          items:
            type: string
            format: uuid
    EqualExpenseAllocationRequest:
      required:
      - participants
      - type
      type: object
      properties:
        participants:
          minItems: 1
          type: array
          items:
            minLength: 1
            type: string
            format: email
        type:
          type: string
          enum:
          - EQUAL
    EqualWithCapsExpenseAllocationRequest:
      required:
      - caps
      - participants
      - type
      type: object
      properties:
        participants:
          minItems: 1
          type: array
          items:
            minLength: 1
            type: string
            format: email
        caps:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ExpenseAllocationCapRequest"
        type:
          type: string
          enum:
          - EQUAL_WITH_CAPS
    ExpenseAllocationCapRequest:
      required:
      - maximumAmountInCents
      - member
      type: object
      properties:
        member:
          minLength: 1
          type: string
          format: email
        maximumAmountInCents:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int64
    ExpenseAllocationRequest:
      type: object
      properties:
        type:
          type: string
      discriminator:
        propertyName: type
        mapping:
          EQUAL_WITH_CAPS: "#/components/schemas/EqualWithCapsExpenseAllocationRequest"
          EQUAL: "#/components/schemas/EqualExpenseAllocationRequest"
          CUSTOM: "#/components/schemas/CustomExpenseAllocationRequest"
          CUMULATIVE_TIERS: "#/components/schemas/CumulativeTiersExpenseAllocationRequest"
      oneOf:
      - $ref: "#/components/schemas/EqualExpenseAllocationRequest"
      - $ref: "#/components/schemas/EqualWithCapsExpenseAllocationRequest"
      - $ref: "#/components/schemas/CumulativeTiersExpenseAllocationRequest"
      - $ref: "#/components/schemas/CustomExpenseAllocationRequest"
    ExpenseDetailParticipationResponse:
      required:
      - amountCents
      - member
      - status
      type: object
      properties:
        member:
          type: string
        amountCents:
          type: integer
          format: int64
        status:
          type: string
    ExpenseDetailResponse:
      required:
      - createdAt
      - createdBy
      - id
      - participations
      - status
      - title
      - totalAmountCents
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdBy:
          type: string
        totalAmountCents:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        participations:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseDetailParticipationResponse"
        refusal:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExpenseRefusalResponse"
    ExpenseParticipationDecisionInput:
      type: string
      enum:
      - APPROVE
      - REFUSE
    ExpenseParticipationDecisionRequest:
      required:
      - decision
      type: object
      properties:
        decision:
          $ref: "#/components/schemas/ExpenseParticipationDecisionInput"
        reason:
          type: string
          nullable: true
    ExpenseRefusalResponse:
      required:
      - member
      - refusedAt
      type: object
      properties:
        member:
          type: string
        refusedAt:
          type: string
          format: date-time
        reason:
          type: string
          nullable: true
    ExpenseResponse:
      required:
      - createdAt
      - createdBy
      - id
      - status
      - title
      - totalAmountCents
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdBy:
          type: string
        totalAmountCents:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        refusal:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ExpenseRefusalResponse"
    ExpenseSupportingDocumentAuditActionResponse:
      type: string
      enum:
      - ATTACHED
