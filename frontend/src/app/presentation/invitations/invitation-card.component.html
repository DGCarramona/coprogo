<mat-card class="material-card invitation-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{
      'invitations.sentBy' | translate: { p0: invitation().invitedBy }
    }}</mat-card-title>
    <mat-card-subtitle>{{ invitation().invitedAt | localizedDate }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <mat-chip-set [attr.aria-label]="'invitations.informationLabel' | translate">
      <mat-chip>{{ 'groups.shortIdentifier' | translate: { p0: shortGroupId() } }}</mat-chip>
      <mat-chip>{{ invitation().invitedMember }}</mat-chip>
    </mat-chip-set>

    <p class="invitation-card__copy">
      {{ 'invitations.joinGroupHelp' | translate }}
      <code>{{ invitation().groupId }}</code
      >.
    </p>
  </mat-card-content>

  <mat-card-actions align="end">
    <button mat-flat-button type="button" [disabled]="accepting()" (click)="accept()">
      {{ (accepting() ? 'invitations.accepting' : 'invitations.accept') | translate }}
    </button>
  </mat-card-actions>
</mat-card>
