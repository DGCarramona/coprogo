<div class="pending-invitations-page__list">
  @for (invitation of invitations(); track invitation.invitationId) {
    <app-invitation-card
      [invitation]="invitation"
      [accepting]="busyInvitationId() === invitation.invitationId"
      (accepted)="invitationAccepted.emit($event)"
    />
  }
</div>

@if (errorMessage(); as errorMessageValue) {
  <div class="pending-invitations-page__message pending-invitations-page__message--error">
    {{ errorMessageValue }}
  </div>
}
