<p>
  <label for="supporting-document-file">{{ 'documents.add' | translate }}</label>
  <input
    id="supporting-document-file"
    type="file"
    [disabled]="viewModel.isUploading()"
    (change)="onFileSelection($event)"
  />
</p>

@if (viewModel.isUploading()) {
  <p role="status">{{ 'documents.uploading' | translate }}</p>
} @else if (viewModel.isUploaded()) {
  <p role="status">{{ 'documents.uploadSuccess' | translate }}</p>
}

@if (viewModel.hasUploadError()) {
  <p role="alert">{{ viewModel.uploadErrorMessage() | errorMessage }}</p>
}
