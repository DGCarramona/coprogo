<section class="reimbursement-review" [attr.aria-label]="'reimbursements.review.title' | translate">
  <label [for]="'reimbursement-rejection-reason-' + reimbursementId()">
    {{ 'common.optionalRefusalReason' | translate }}
  </label>
  <textarea
    [id]="'reimbursement-rejection-reason-' + reimbursementId()"
    [value]="viewModel.rejectionReason()"
    [disabled]="viewModel.isReviewing()"
    (input)="updateRejectionReason($event)"
  ></textarea>

  @if (viewModel.errorMessage(); as errorMessage) {
    <p role="alert">{{ errorMessage | errorMessage }}</p>
  }

  <div class="reimbursement-review__actions">
    <button
      matButton="filled"
      type="button"
      [attr.aria-label]="'reimbursements.review.acceptLabel' | translate"
      [disabled]="viewModel.isReviewing()"
      (click)="viewModel.accept()"
    >
      {{ 'common.accept' | translate }}
    </button>
    <button
      matButton="outlined"
      type="button"
      [attr.aria-label]="'reimbursements.review.refuseLabel' | translate"
      [disabled]="viewModel.isReviewing()"
      (click)="viewModel.reject()"
    >
      {{ 'common.refuse' | translate }}
    </button>
  </div>
</section>
